<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#6c3ce8">

<meta name="description" content="Pozito Regalón 2026 - Ranking oficial de participantes">

<title>🎁 Ranking Pozito Regalón 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

:root {

    --primario: #6c3ce8;
    --primario-oscuro: #4820b5;
    --primario-claro: #895cf5;

    --azul: #168bdb;
    --rosado: #f05b91;
    --turquesa: #13a887;
    --naranja: #f0a52b;

    --blanco: #ffffff;
    --fondo: #f4f5fa;
    --texto: #292b3a;
    --gris: #74788b;

    --oro: #e8b932;
    --plata: #aeb8ca;
    --bronce: #d58b59;

}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    padding: 30px 22px;

    color: var(--texto);

    overflow-x: hidden;

    background:

        radial-gradient(
            circle at 5% 5%,
            #895cf522,
            transparent 27%
        ),

        radial-gradient(
            circle at 95% 5%,
            #168bdb20,
            transparent 27%
        ),

        radial-gradient(
            circle at 5% 95%,
            #f05b911c,
            transparent 27%
        ),

        radial-gradient(
            circle at 95% 95%,
            #13a8871c,
            transparent 27%
        ),

        linear-gradient(
            135deg,
            #f4f2ff,
            #f8faff 50%,
            #fff4f8
        );

}


/* =====================================================
   DECORACIONES
===================================================== */

body::before {

    content: "⭐ 🎁 ✨ 🏆 ✨ 🎁 ⭐";

    position: fixed;

    top: 10px;

    left: 10px;
    right: 10px;

    text-align: center;

    font-size: 23px;

    letter-spacing: 7px;

    opacity: .22;

    pointer-events: none;

    z-index: 0;

}


body::after {

    content: "🎁 ⭐ 🏆 ✨ 🏆 ⭐ 🎁";

    position: fixed;

    bottom: 10px;

    left: 10px;
    right: 10px;

    text-align: center;

    font-size: 23px;

    letter-spacing: 7px;

    opacity: .20;

    pointer-events: none;

    z-index: 0;

}


/* =====================================================
   TITULO PRINCIPAL
===================================================== */

h1 {

    position: relative;

    z-index: 2;

    text-align: center;

    color: var(--primario);

    font-size: clamp(28px, 5vw, 53px);

    font-weight: 900;

    margin-bottom: 12px;

    letter-spacing: 1px;

    text-shadow: 0 4px 10px #4820b520;

}


h1::before {

    content: "🎁";

    margin-right: 12px;

    display: inline-block;

    animation: regalo 2s infinite ease-in-out;

}


h1::after {

    content: "🎁";

    margin-left: 12px;

    display: inline-block;

    animation: regalo 2s infinite ease-in-out reverse;

}


@keyframes regalo {

    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-7px) rotate(5deg);
    }

}


/* =====================================================
   SUBTITULO
===================================================== */

.subtitulo {

    position: relative;

    z-index: 2;

    text-align: center;

    margin-bottom: 30px;

    color: var(--azul);

    font-size: 17px;

    font-weight: 700;

}


.periodo {

    position: relative;

    z-index: 2;

    display: table;

    margin: 0 auto 38px;

    padding: 10px 23px;

    border-radius: 30px;

    background: white;

    color: var(--primario-oscuro);

    border: 1px solid #895cf544;

    box-shadow: 0 6px 18px #4820b512;

    font-size: 14px;

    font-weight: 800;

}


/* =====================================================
   ESTADISTICAS
===================================================== */

.estadisticas {

    position: relative;

    z-index: 2;

    max-width: 1050px;

    margin: 0 auto 35px;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 16px;

}


.estadistica {

    padding: 20px;

    text-align: center;

    background: white;

    border-radius: 18px;

    border-bottom: 5px solid var(--primario);

    box-shadow: 0 8px 22px #292b3a12;

}


.estadistica:nth-child(2) {
    border-bottom-color: var(--azul);
}


.estadistica:nth-child(3) {
    border-bottom-color: var(--turquesa);
}


.estadistica h2 {

    font-size: 29px;

    font-weight: 900;

    color: var(--primario);

}


.estadistica p {

    font-size: 13px;

    color: var(--gris);

    font-weight: 700;

}


/* =====================================================
   MENSAJE SIN PARTICIPANTES
===================================================== */

.sinResultados {

    position: relative;

    z-index: 2;

    max-width: 700px;

    margin: 80px auto;

    padding: 45px 25px;

    background: white;

    border: 2px solid #895cf555;

    border-radius: 25px;

    text-align: center;

    box-shadow: 0 20px 50px #4820b515;

}


.sinResultados h2 {

    font-size: 27px;

    margin-bottom: 15px;

    color: var(--primario);

}


.sinResultados p {

    font-size: 16px;

    color: var(--gris);

    line-height: 1.8;

}


/* =====================================================
   GALERIA
===================================================== */

.galeria {

    position: relative;

    z-index: 2;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 23px;

    width: 100%;

    max-width: 1500px;

    margin: auto;

}


/* =====================================================
   TARJETAS
===================================================== */

.tarjeta {

    position: relative;

    background: linear-gradient(
        145deg,
        #ffffff,
        #f8f6ff
    );

    padding: 13px;

    border-radius: 22px;

    cursor: pointer;

    overflow: hidden;

    border: 2px solid #895cf544;

    box-shadow: 0 12px 30px #292b3a12;

    transition: .3s;

}


.tarjeta::before {

    content: "✨";

    position: absolute;

    top: -10px;

    right: 5px;

    font-size: 45px;

    opacity: .15;

}


.tarjeta::after {

    content: "🎁";

    position: absolute;

    bottom: -13px;

    left: 0;

    font-size: 42px;

    opacity: .12;

}


.tarjeta:hover {

    transform: translateY(-7px);

    box-shadow: 0 20px 40px #4820b525;

    border-color: var(--primario);

}


.tarjeta h2 {

    position: relative;

    z-index: 2;

    text-align: center;

    color: var(--primario-oscuro);

    font-size: 18px;

    font-weight: 800;

    margin: 8px 0 13px;

}


.miniatura {

    width: 100%;

    display: block;

    border-radius: 15px;

    box-shadow: 0 7px 18px #0002;

    transition: .3s;

}


.tarjeta:hover .miniatura {

    transform: scale(1.015);

}


/* =====================================================
   VISOR
===================================================== */

.visor {

    position: fixed;

    inset: 0;

    background: rgba(25, 20, 50, .88);

    backdrop-filter: blur(12px);

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 100;

    padding: 20px;

}


.visor.activo {

    display: flex;

    animation: aparecer .25s ease;

}


@keyframes aparecer {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


.visorCaja {

    position: relative;

    background: linear-gradient(
        145deg,
        white,
        #f7f4ff
    );

    padding: 17px;

    border-radius: 24px;

    max-width: 94vw;

    max-height: 94vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    box-shadow: 0 30px 80px #0008;

}


#imagenGrande {

    max-width: 88vw;

    max-height: 77vh;

    border-radius: 15px;

    display: block;

    box-shadow: 0 15px 40px #0005;

    object-fit: contain;

}


/* =====================================================
   CERRAR
===================================================== */

.cerrar {

    position: absolute;

    right: 10px;

    top: 10px;

    width: 44px;

    height: 44px;

    border: none;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #ef5270,
        #d82c50
    );

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;

    z-index: 5;

    box-shadow: 0 5px 15px #0004;

    transition: .25s;

}


.cerrar:hover {

    transform: rotate(90deg) scale(1.08);

}


/* =====================================================
   DESCARGAR
===================================================== */

.descargar {

    margin-top: 15px;

    padding: 13px 30px;

    border: none;

    border-radius: 12px;

    background: linear-gradient(
        135deg,
        #13a887,
        #087f68
    );

    color: white;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

    box-shadow: 0 7px 18px #13a88744;

    transition: .3s;

}


.descargar:hover {

    transform: translateY(-3px);

    box-shadow: 0 10px 24px #13a88755;

}


/* =====================================================
   ZONA OCULTA
===================================================== */

#zonaImagenes {

    position: fixed;

    left: -20000px;

    top: 0;

    width: 1080px;

    pointer-events: none;

}


/* =====================================================
   PLANTILLA DE IMAGEN
===================================================== */

.paginaImagen {

    width: 1080px;

    min-height: 1350px;

    padding: 55px;

    position: relative;

    overflow: hidden;

    color: var(--texto);

    background:

        radial-gradient(
            circle at 8% 5%,
            #895cf522,
            transparent 25%
        ),

        radial-gradient(
            circle at 92% 7%,
            #168bdb22,
            transparent 27%
        ),

        radial-gradient(
            circle at 5% 95%,
            #f05b9122,
            transparent 27%
        ),

        radial-gradient(
            circle at 95% 95%,
            #13a88720,
            transparent 28%
        ),

        linear-gradient(
            145deg,
            #f8f6ff,
            #ffffff 50%,
            #f4faff
        );

}


/* =====================================================
   DECORACION DE IMAGEN
===================================================== */

.paginaImagen::before {

    content: "⭐ 🎁 ✨ 🏆 ✨ 🎁 ⭐";

    position: absolute;

    top: 20px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 34px;

    letter-spacing: 6px;

    opacity: .45;

}


.paginaImagen::after {

    content: "🎁 ⭐ 🏆 ✨ 🏆 ⭐ 🎁";

    position: absolute;

    bottom: 20px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 32px;

    letter-spacing: 6px;

    opacity: .30;

}


/* =====================================================
   TITULO DE IMAGEN
===================================================== */

.tituloRanking {

    position: relative;

    z-index: 2;

    text-align: center;

    font-size: 55px;

    font-weight: 900;

    color: var(--primario);

    letter-spacing: 1px;

    margin-bottom: 35px;

    padding-top: 30px;

    text-shadow: 0 4px 10px #4820b518;

}


.tituloRanking::before {

    content: "🎁";

    display: block;

    font-size: 75px;

    line-height: 1;

    margin-bottom: 8px;

}


.tituloRanking span {

    display: inline-block;

    margin-top: 12px;

    padding: 8px 28px;

    border-radius: 25px;

    color: var(--primario-oscuro);

    font-size: 26px;

    font-weight: 800;

    background: linear-gradient(
        135deg,
        #eee8ff,
        #e8f5ff
    );

    border: 2px solid #895cf566;

    box-shadow: 0 6px 18px #4820b515;

}


/* =====================================================
   LISTA
===================================================== */

.listaRanking {

    position: relative;

    z-index: 2;

}


/* =====================================================
   FILAS
===================================================== */

.filaRanking {

    position: relative;

    display: flex;

    justify-content: space-between;

    align-items: center;

    min-height: 75px;

    padding: 13px 22px;

    margin-bottom: 12px;

    border-radius: 17px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #f8f6ff
    );

    color: #292b3a;

    font-size: 25px;

    font-weight: 700;

    box-shadow: 0 6px 17px #292b3a15;

    border: 2px solid #895cf533;

}


.filaRanking div {

    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;

}


.filaRanking b {

    color: var(--primario);

    font-size: 23px;

    min-width: 65px;

}


.filaRanking .nombreJugador {

    color: #292b3a;

    font-size: 25px;

    font-weight: 800;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


/* =====================================================
   PUNTOS
===================================================== */

.filaRanking strong {

    display: flex;

    align-items: center;

    justify-content: center;

    min-width: 155px;

    padding: 8px 17px;

    border-radius: 13px;

    color: #684f00;

    font-size: 24px;

    font-weight: 900;

    white-space: nowrap;

    background: linear-gradient(
        135deg,
        #fff3b0,
        #ffe082
    );

    border: 2px solid #d4a72c88;

    box-shadow: 0 4px 10px #d4a72c22;

}


/* =====================================================
   PRIMEROS 3
===================================================== */

.oro,
.plata,
.bronce {

    min-height: 78px;

}


/* ORO */

.oro {

    background: linear-gradient(
        90deg,
        #fff8d7,
        #fff0a8
    );

    border-color: #e0b52f;

}


.oro b {
    color: #8a6700;
}


/* PLATA */

.plata {

    background: linear-gradient(
        90deg,
        #f7f8fa,
        #e2e6ed
    );

    border-color: #aeb8ca;

}


.plata b {
    color: #596477;
}


.plata strong {

    background: linear-gradient(
        135deg,
        #f1f3f7,
        #dfe4eb
    );

    border-color: #aeb8ca;

    color: #4f5a68;

}


/* BRONCE */

.bronce {

    background: linear-gradient(
        90deg,
        #fff0df,
        #f2d0b0
    );

    border-color: #d2935c;

}


.bronce b {
    color: #814c27;
}


.bronce strong {

    background: linear-gradient(
        135deg,
        #f5d4b5,
        #e6b383
    );

    border-color: #c98650;

    color: #70421f;

}


/* =====================================================
   RESTO DEL RANKING
===================================================== */

.filaRanking:nth-child(n+4) {

    min-height: 68px;

    padding: 11px 20px;

    font-size: 23px;

}


.filaRanking:nth-child(n+4) strong {

    font-size: 23px;

}


.filaRanking:nth-child(n+4) b {

    color: #6c3ce8;

}


/* =====================================================
   SEPARADOR
===================================================== */

.listaRanking::after {

    content: "✨ ✦ 🎁 ✦ ⭐ ✦ 🏆";

    display: block;

    text-align: center;

    font-size: 25px;

    color: var(--primario);

    margin-top: 25px;

    opacity: .7;

}


/* =====================================================
   PIE DE IMAGEN
===================================================== */

.finalRanking {

    position: absolute;

    z-index: 2;

    bottom: 32px;

    left: 55px;
    right: 55px;

    padding-top: 17px;

    border-top: 2px solid #895cf555;

    text-align: center;

    font-size: 19px;

    color: var(--primario);

    font-weight: 800;

}


/* =====================================================
   ANIMACION TARJETAS
===================================================== */

.tarjeta {

    animation: tarjetaEntrada .5s ease backwards;

}


.tarjeta:nth-child(2) {
    animation-delay: .08s;
}

.tarjeta:nth-child(3) {
    animation-delay: .16s;
}

.tarjeta:nth-child(4) {
    animation-delay: .24s;
}

.tarjeta:nth-child(5) {
    animation-delay: .32s;
}

.tarjeta:nth-child(6) {
    animation-delay: .40s;
}


@keyframes tarjetaEntrada {

    from {

        opacity: 0;

        transform: translateY(20px) scale(.98);

    }

    to {

        opacity: 1;

        transform: translateY(0) scale(1);

    }

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1250px) {

    .galeria {
        grid-template-columns: repeat(3, 1fr);
    }

}


@media(max-width:900px) {

    body {
        padding: 25px 15px;
    }

    h1 {
        font-size: 32px;
    }

    .galeria {
        grid-template-columns: repeat(2, 1fr);
        gap: 17px;
    }

}


@media(max-width:600px) {

    body {
        padding: 20px 10px;
    }

    h1 {
        font-size: 25px;
        line-height: 1.4;
    }

    h1::before,
    h1::after {
        margin: 0 3px;
    }

    .subtitulo {
        font-size: 14px;
    }

    .periodo {
        font-size: 11px;
        text-align: center;
    }

    .estadisticas {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .estadistica {
        padding: 14px;
    }

    .galeria {
        grid-template-columns: 1fr;
        max-width: 450px;
    }

    .visor {
        padding: 10px;
    }

    .visorCaja {
        padding: 9px;
        border-radius: 17px;
    }

    #imagenGrande {
        max-width: 92vw;
        max-height: 75vh;
    }

    .cerrar {
        width: 40px;
        height: 40px;
    }

}


/* =====================================================
   ACCESIBILIDAD
===================================================== */

@media(prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation: none !important;

        transition: none !important;

        scroll-behavior: auto !important;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TITULO
===================================================== -->

<h1>
    POZITO REGALÓN 2026
</h1>


<p class="subtitulo">
    ⭐ GALERÍA OFICIAL DEL GRAN RANKING ⭐
</p>


<div class="periodo">
    🎉 DEL 03 DE NOVIEMBRE AL 02 DE DICIEMBRE DE 2026 🎉
</div>


<!-- =====================================================
     ESTADISTICAS
===================================================== -->

<section class="estadisticas">

    <div class="estadistica">

        <h2 id="cantidad">
            0
        </h2>

        <p>
            👥 PARTICIPANTES
        </p>

    </div>


    <div class="estadistica">

        <h2 id="lider">
            -
        </h2>

        <p>
            👑 LÍDER ACTUAL
        </p>

    </div>


    <div class="estadistica">

        <h2 id="puntos">
            0
        </h2>

        <p>
            ⭐ PUNTOS ACUMULADOS
        </p>

    </div>

</section>


<!-- =====================================================
     GALERIA
===================================================== -->

<div
    class="galeria"
    id="galeria">
</div>


<!-- =====================================================
     VISOR
===================================================== -->

<div
    class="visor"
    id="visor">

    <div class="visorCaja">

        <button
            class="cerrar"
            onclick="cerrarImagen()">

            ✖

        </button>


        <img
            id="imagenGrande"
            alt="Ranking Pozito Regalón 2026">


        <button
            class="descargar"
            onclick="descargarImagen()">

            ⬇ DESCARGAR IMAGEN

        </button>

    </div>

</div>


<!-- =====================================================
     ZONA OCULTA
===================================================== -->

<div id="zonaImagenes"></div>


<script>

/* =====================================================
   CONFIGURACION
===================================================== */

const KEY_JUGADORES =
    "POZITO_REGALON_2026_JUGADORES_V1";


const galeria =
    document.getElementById("galeria");


const zona =
    document.getElementById("zonaImagenes");


let jugadores = [];

let imagenActual = "";


/* =====================================================
   CARGAR PARTICIPANTES
===================================================== */

try {

    jugadores = JSON.parse(
        localStorage.getItem(KEY_JUGADORES)
    ) || [];

    if (!Array.isArray(jugadores)) {
        jugadores = [];
    }

} catch(error) {

    console.error(
        "Error leyendo participantes:",
        error
    );

    jugadores = [];

}


/* =====================================================
   CALCULAR TOTAL
===================================================== */

function calcularTotal(jugador) {

    if (
        !jugador ||
        !jugador.puntos ||
        typeof jugador.puntos !== "object"
    ) {
        return 0;
    }

    return Object.values(jugador.puntos)
        .reduce((total, puntos) => {

            const valor = Number(puntos);

            return total + (
                Number.isFinite(valor) && valor > 0
                    ? valor
                    : 0
            );

        }, 0);

}


/* =====================================================
   PREPARAR RANKING
===================================================== */

jugadores = jugadores
    .filter(j =>
        j &&
        typeof j.nombre === "string"
    )
    .map(j => ({
        nombre: j.nombre,
        puntos: j.puntos || {},
        total: calcularTotal(j)
    }))
    .sort((a, b) => b.total - a.total);


/* =====================================================
   ESTADISTICAS
===================================================== */

function actualizarEstadisticas() {

    const total = jugadores.reduce(
        (suma, jugador) => suma + jugador.total,
        0
    );

    document.getElementById(
        "cantidad"
    ).textContent = jugadores.length;

    document.getElementById(
        "lider"
    ).textContent = jugadores.length
        ? jugadores[0].nombre
        : "-";

    document.getElementById(
        "puntos"
    ).textContent = total;

}


/* =====================================================
   SI NO HAY PARTICIPANTES
===================================================== */

if (jugadores.length === 0) {

    const mensaje = document.createElement("div");

    mensaje.className = "sinResultados";

    const titulo = document.createElement("h2");

    titulo.textContent =
        "🎁 NO HAY PARTICIPANTES 🎁";

    const texto = document.createElement("p");

    texto.textContent =
        "Todavía no hay participantes registrados en el Pozito Regalón 2026. Agrega participantes y registra sus puntajes en la página principal.";

    mensaje.append(titulo, texto);

    galeria.appendChild(mensaje);

} else {

    actualizarEstadisticas();

    if (typeof html2canvas === "undefined") {

        galeria.textContent =
            "No se pudo cargar el generador de imágenes. Comprueba tu conexión a internet y vuelve a cargar la página.";

    } else {

        crearPaginas();

    }

}


/* =====================================================
   CREAR PAGINAS
===================================================== */

function crearPaginas() {

    let paginas = [];


    // PRIMERA PAGINA: TOP 15

    paginas.push({

        titulo: "TOP 15",

        datos: jugadores.slice(0, 15),

        inicio: 1

    });


    // SIGUIENTES PAGINAS: 20 PARTICIPANTES

    for (
        let i = 15;
        i < jugadores.length;
        i += 20
    ) {

        paginas.push({

            titulo:
                `PUESTOS ${i + 1} - ${Math.min(i + 20, jugadores.length)}`,

            datos: jugadores.slice(i, i + 20),

            inicio: i + 1

        });

    }


    // GENERAR CADA IMAGEN

    paginas.forEach((pagina, index) => {

        crearImagenRanking(
            pagina,
            index
        );

    });

}


/* =====================================================
   CREAR IMAGEN DEL RANKING
===================================================== */

function crearImagenRanking(pagina, index) {

    const div = document.createElement("div");

    div.className = "paginaImagen";


    // TITULO

    const titulo = document.createElement("div");

    titulo.className = "tituloRanking";

    titulo.appendChild(
        document.createTextNode("POZITO REGALÓN")
    );

    const subtitulo = document.createElement("span");

    subtitulo.textContent = pagina.titulo;

    titulo.appendChild(
        document.createElement("br")
    );

    titulo.appendChild(subtitulo);


    // LISTA

    const lista = document.createElement("div");

    lista.className = "listaRanking";


    // PIE

    const final = document.createElement("div");

    final.className = "finalRanking";

    final.textContent =
        "🎁 POZITO REGALÓN 2026 • 03 DE NOVIEMBRE AL 02 DE DICIEMBRE 🎁";


    div.append(
        titulo,
        lista,
        final
    );


    // CREAR FILAS

    pagina.datos.forEach((jugador, i) => {

        const puesto = pagina.inicio + i;

        const fila = document.createElement("div");

        fila.className = "filaRanking";


        if (puesto === 1) {
            fila.classList.add("oro");
        }

        if (puesto === 2) {
            fila.classList.add("plata");
        }

        if (puesto === 3) {
            fila.classList.add("bronce");
        }


        // ICONOS

        let icono = "🎁";

        if (puesto === 1) icono = "🥇";

        if (puesto === 2) icono = "🥈";

        if (puesto === 3) icono = "🥉";


        // INFORMACION DEL JUGADOR

        const informacion = document.createElement("div");

        const emoji = document.createElement("span");

        emoji.textContent = icono;

        const numero = document.createElement("b");

        numero.textContent = "#" + puesto;

        const nombre = document.createElement("span");

        nombre.className = "nombreJugador";

        nombre.textContent = jugador.nombre;


        informacion.append(
            emoji,
            numero,
            nombre
        );


        // PUNTOS

        const puntos = document.createElement("strong");

        puntos.textContent =
            "⭐ " + jugador.total + " PUNTOS";


        fila.append(
            informacion,
            puntos
        );

        lista.appendChild(fila);

    });


    // AGREGAR A ZONA OCULTA

    zona.appendChild(div);


    // GENERAR PNG

    requestAnimationFrame(() => {

        html2canvas(div, {

            scale: 2,

            backgroundColor: null,

            logging: false,

            useCORS: true,

            width: 1080,

            windowWidth: 1080

        })

        .then(canvas => {

            const imagen = canvas.toDataURL(
                "image/png"
            );

            crearTarjeta(
                pagina.titulo,
                imagen
            );

            div.remove();

        })

        .catch(error => {

            console.error(
                "Error generando ranking:",
                error
            );

            const aviso = document.createElement("p");

            aviso.textContent =
                "No se pudo generar " + pagina.titulo;

            galeria.appendChild(aviso);

            div.remove();

        });

    });

}


/* =====================================================
   CREAR TARJETA DE GALERIA
===================================================== */

function crearTarjeta(titulo, imagen) {

    const tarjeta = document.createElement("div");

    tarjeta.className = "tarjeta";


    const encabezado = document.createElement("h2");

    encabezado.textContent = titulo;


    const miniatura = document.createElement("img");

    miniatura.className = "miniatura";

    miniatura.src = imagen;

    miniatura.alt = titulo;


    tarjeta.append(
        encabezado,
        miniatura
    );


    tarjeta.onclick = function() {

        abrirImagen(imagen);

    };


    galeria.appendChild(tarjeta);

}


/* =====================================================
   ABRIR IMAGEN
===================================================== */

function abrirImagen(imagen) {

    imagenActual = imagen;

    document.getElementById(
        "imagenGrande"
    ).src = imagen;

    document.getElementById(
        "visor"
    ).classList.add("activo");

    document.body.style.overflow = "hidden";

}


/* =====================================================
   CERRAR IMAGEN
===================================================== */

function cerrarImagen() {

    document.getElementById(
        "visor"
    ).classList.remove("activo");

    document.body.style.overflow = "";

}


/* =====================================================
   DESCARGAR IMAGEN
===================================================== */

function descargarImagen() {

    if (!imagenActual) {
        return;
    }


    const enlace = document.createElement("a");

    enlace.href = imagenActual;

    enlace.download =
        "Ranking_Pozito_Regalon_2026.png";

    document.body.appendChild(enlace);

    enlace.click();

    enlace.remove();

}


/* =====================================================
   CERRAR AL PRESIONAR ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            cerrarImagen();

        }

    }
);


/* =====================================================
   CERRAR AL HACER CLIC FUERA
===================================================== */

document.getElementById("visor").addEventListener(
    "click",
    function(event) {

        if (event.target === this) {

            cerrarImagen();

        }

    }
);

</script>
